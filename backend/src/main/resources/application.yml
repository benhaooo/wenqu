spring:
  application:
    name: wenqu
  config:
    # 本地开发读取根目录 .env；部署环境直接注入环境变量
    import: optional:file:../.env[.properties]
  threads:
    virtual:
      enabled: true
  servlet:
    multipart:
      # 单文件上限 20MB（导入文件），图片另有更小的限制
      max-file-size: 20MB
      max-request-size: 21MB
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:wenqu}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  flyway:
    placeholders:
      # 向量列维度，只在首次建表时生效，见 docs/modules/retrieval.md
      "[embedding_dimensions]": ${AI_EMBEDDING_DIMENSIONS:1024}
    default-schema: public
    schemas: public,auth,workspace,document,ingestion,retrieval,chat,usage,infra
    create-schemas: true
    locations: classpath:db/migration
  jooq:
    sql-dialect: postgres
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME}
    password: ${RABBITMQ_PASSWORD}
    # 发件箱转发与延迟重试等待 broker 确认后才算发送成功
    publisher-confirm-type: simple
    listener:
      simple:
        # 任务调用模型耗时较长，每个消费者一次只取一条，避免消息积压在单个消费者上
        prefetch: 1

wenqu:
  auth:
    jwt-secret: ${JWT_SECRET}
    access-token-ttl: ${ACCESS_TOKEN_TTL:PT2H}
    refresh-token-ttl: ${REFRESH_TOKEN_TTL:P7D}
    cookie-secure: ${AUTH_COOKIE_SECURE:false}
  ai:
    chat:
      base-url: ${AI_CHAT_BASE_URL:}
      api-key: ${AI_CHAT_API_KEY:}
      model: ${AI_CHAT_MODEL:}
      temperature: ${AI_CHAT_TEMPERATURE:0.2}
      timeout: ${AI_CHAT_TIMEOUT:PT120S}
    embedding:
      base-url: ${AI_EMBEDDING_BASE_URL:}
      api-key: ${AI_EMBEDDING_API_KEY:}
      model: ${AI_EMBEDDING_MODEL:}
      dimensions: ${AI_EMBEDDING_DIMENSIONS:1024}
      timeout: ${AI_EMBEDDING_TIMEOUT:PT30S}
  ingestion:
    chunk-max-tokens: ${CHUNK_MAX_TOKENS:800}
    chunk-overlap-tokens: ${CHUNK_OVERLAP_TOKENS:100}
  chat:
    top-k: ${RETRIEVAL_TOP_K:8}
    min-similarity: ${RETRIEVAL_MIN_SIMILARITY:0.35}
    history-rounds: 5
  storage:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    # 浏览器访问签名链接使用的地址，默认与 endpoint 相同
    public-endpoint: ${MINIO_PUBLIC_ENDPOINT:${MINIO_ENDPOINT:http://localhost:9000}}
    access-key: ${MINIO_ACCESS_KEY}
    secret-key: ${MINIO_SECRET_KEY}
    bucket: ${MINIO_BUCKET:wenqu}

server:
  port: ${BACKEND_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: false
  # 健康检查只反映外部依赖的连接状态
  health:
    diskspace:
      enabled: false
    ping:
      enabled: false
    ssl:
      enabled: false

springdoc:
  api-docs:
    # swagger-core 以 3.1 输出泛型字段（ApiResult.data）时会附加 "type": "null"，导致生成的前端类型错误
    version: openapi_3_0
  default-produces-media-type: application/json
  writer-with-order-by-keys: true
  writer-with-default-pretty-printer: true
